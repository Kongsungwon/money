<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>백만장자 하루 체험기</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --gold: #C8A84B;
  --gold-light: #E2C97E;
  --gold-dim: rgba(200,168,75,0.12);
  --gold-border: rgba(200,168,75,0.22);
  --black: #080808;
  --dark: #101010;
  --dark2: #161616;
  --dark3: #1E1E1E;
  --dark4: #2A2A2A;
  --white: #F2EDE4;
  --white-dim: rgba(242,237,228,0.55);
  --gray: #555;
  --gray2: #888;
  --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'IBM Plex Mono', 'Courier New', monospace;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--black);
  color: var(--white);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

/* ── SCREENS ── */
.screen { position:fixed; inset:0; display:none; }
.screen.active { display:flex; flex-direction:column; }

/* ── INTRO ── */
#intro {
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
  overflow-y: auto;
  background: var(--black);
}

.intro-wrap {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}

.chip {
  display: inline-block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--gold);
  border: 1px solid var(--gold-border);
  padding: 5px 14px;
  margin-bottom: 2rem;
  opacity: 0;
  animation: up 0.6s 0.1s forwards;
}

.intro-h {
  font-size: clamp(3rem, 10vw, 5.5rem);
  font-weight: 800;
  line-height: 0.95;
  letter-spacing: -0.04em;
  margin-bottom: 1.8rem;
  opacity: 0;
  animation: up 0.6s 0.3s forwards;
}

.intro-h em { font-style: normal; color: var(--gold); }

.intro-p {
  font-size: 0.9rem;
  color: var(--white-dim);
  line-height: 1.85;
  font-weight: 300;
  margin-bottom: 2rem;
  opacity: 0;
  animation: up 0.6s 0.5s forwards;
}

.amount {
  font-family: var(--mono);
  font-size: clamp(0.85rem, 2.5vw, 1.1rem);
  color: var(--gold);
  background: var(--gold-dim);
  border: 1px solid var(--gold-border);
  padding: 10px 20px;
  margin-bottom: 2.5rem;
  letter-spacing: 0.06em;
  opacity: 0;
  animation: up 0.6s 0.7s forwards;
}

.btn {
  background: var(--gold);
  color: var(--black);
  border: none;
  padding: 13px 32px;
  font-family: var(--sans);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: background 0.12s, transform 0.12s;
  opacity: 0;
  animation: up 0.6s 0.9s forwards;
}
.btn:hover { background: var(--gold-light); transform: translateY(-1px); }
.btn-anim-none { animation: none; opacity: 1; }

.meta-row {
  display: flex;
  gap: 2.5rem;
  margin-top: 3rem;
  opacity: 0;
  animation: up 0.6s 1.1s forwards;
}

.meta-item { text-align: center; }
.meta-n { font-size: 1.5rem; font-weight: 800; color: var(--gold); letter-spacing: -0.03em; }
.meta-l { font-family: var(--mono); font-size: 9px; color: var(--gray); letter-spacing: 0.18em; text-transform: uppercase; margin-top: 2px; }

/* ── NAME ── */
#name-input {
  align-items: center;
  justify-content: center;
  padding: 2rem;
  text-align: center;
}

.name-lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; margin-bottom: 1.2rem; }
.name-h { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 2.2rem; }
.name-inp {
  background: transparent; border: none; border-bottom: 2px solid var(--gold);
  color: var(--white); font-family: var(--sans); font-size: 1.8rem; font-weight: 700;
  text-align: center; width: 300px; max-width: 88vw; padding: 6px 4px; outline: none;
  margin-bottom: 2.5rem; letter-spacing: -0.02em;
}
.name-inp::placeholder { color: var(--dark4); }

/* ── GAME ── */
#game { height: 100dvh; overflow: hidden; background: var(--black); }

.hud {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  border-bottom: 1px solid var(--dark3);
  background: rgba(8,8,8,0.98);
}

.hud-c { padding: 9px 14px; border-right: 1px solid var(--dark3); }
.hud-c:last-child { border-right: none; }
.hud-k { font-family: var(--mono); font-size: 9px; letter-spacing: 0.2em; color: var(--gray); text-transform: uppercase; margin-bottom: 2px; }
.hud-v { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.prog-track { height: 2px; background: var(--dark3); flex-shrink: 0; }
.prog-fill { height: 100%; background: var(--gold); transition: width 0.4s ease; }

.part-bar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  border-bottom: 1px solid var(--dark3);
  background: var(--dark2);
}

.part-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
.part-lbl { font-family: var(--mono); font-size: 10px; color: var(--gold); letter-spacing: 0.12em; }
.part-time { font-family: var(--mono); font-size: 9px; color: var(--gray); margin-left: auto; }

/* 질문 영역 — 스크롤 없이 상단 고정 */
.game-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

.q-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 18px 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 0;
}
.q-scroll::-webkit-scrollbar { width: 2px; }
.q-scroll::-webkit-scrollbar-thumb { background: var(--dark4); }

.q-no { font-family: var(--mono); font-size: 9px; color: var(--gray); letter-spacing: 0.18em; }
.q-txt { font-size: clamp(0.95rem, 2.2vw, 1.15rem); font-weight: 600; line-height: 1.55; letter-spacing: -0.01em; }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
@media (max-width: 460px) { .choices { grid-template-columns: 1fr; } }

.choice {
  background: var(--dark2);
  border: 1px solid var(--dark3);
  color: var(--white-dim);
  padding: 11px 13px;
  text-align: left;
  cursor: pointer;
  transition: border-color 0.1s, background 0.1s, color 0.1s;
  font-family: var(--sans);
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 0.82rem;
  line-height: 1.5;
  font-weight: 400;
}
.choice:hover { border-color: var(--gold-border); background: var(--gold-dim); color: var(--white); }
.choice.sel { border-color: var(--gold); background: var(--gold-dim); color: var(--white); }
.choice.done { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
.choice.done.sel { opacity: 1; }
.c-e { font-size: 1.05rem; flex-shrink: 0; margin-top: 1px; }

/* 타임라인 스트립 */
.tl-strip {
  flex-shrink: 0;
  border-top: 1px solid var(--dark3);
  background: var(--dark);
  padding: 7px 16px;
  display: flex;
  align-items: center;
  gap: 7px;
  overflow: hidden;
}

.tl-label { font-family: var(--mono); font-size: 9px; color: var(--gray); letter-spacing: 0.12em; flex-shrink: 0; }
.tl-chips { display: flex; gap: 5px; overflow-x: auto; flex: 1; }
.tl-chips::-webkit-scrollbar { display: none; }

.tl-chip {
  flex-shrink: 0;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--gray2);
  background: var(--dark3);
  padding: 3px 7px;
  white-space: nowrap;
  animation: chipIn 0.25s ease forwards;
}

@keyframes chipIn { from { opacity:0; transform:scale(0.88); } to { opacity:1; transform:scale(1); } }

/* ── RESULT ── */
#result { overflow-y: auto; background: var(--black); }
#result::-webkit-scrollbar { width: 2px; }
#result::-webkit-scrollbar-thumb { background: var(--dark4); }

.r-inner { max-width: 660px; margin: 0 auto; padding: 3rem 1.5rem 4rem; width: 100%; }

.r-tag { font-family: var(--mono); font-size: 9px; letter-spacing: 0.22em; color: var(--gold); text-transform: uppercase; margin-bottom: 1rem; }
.r-emoji { font-size: 3rem; margin-bottom: 0.8rem; display: block; }
.r-name { font-size: clamp(2rem, 7vw, 3.5rem); font-weight: 800; color: var(--gold); letter-spacing: -0.04em; line-height: 1.0; margin-bottom: 0.4rem; }
.r-desc { font-size: 0.85rem; color: var(--gray2); font-weight: 300; margin-bottom: 2.5rem; }

.r-sec { margin-bottom: 2rem; }
.r-sec-lbl { font-family: var(--mono); font-size: 9px; letter-spacing: 0.22em; color: var(--gold); text-transform: uppercase; margin-bottom: 0.9rem; padding-bottom: 6px; border-bottom: 1px solid var(--dark3); }

.spend-box { background: var(--dark2); border: 1px solid var(--dark3); padding: 1.3rem; }
.spend-big { font-size: 2.2rem; font-weight: 800; color: var(--gold); letter-spacing: -0.03em; }
.spend-sub { font-family: var(--mono); font-size: 9px; color: var(--gray); letter-spacing: 0.12em; margin-bottom: 1.2rem; margin-top: 2px; }

.bar-row { margin-bottom: 8px; }
.bar-meta { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 9px; color: var(--gray2); margin-bottom: 4px; }
.bar-track { height: 2px; background: var(--dark4); }
.bar-fill { height: 100%; background: var(--gold); transition: width 1.2s cubic-bezier(0.16,1,0.3,1); }
.bar-fill.b { background: #4A90D9; }

.comment-box {
  border-left: 2px solid var(--gold);
  padding: 1.1rem 1.3rem;
  font-size: 0.9rem;
  line-height: 1.95;
  color: var(--white-dim);
  background: var(--dark2);
  white-space: pre-line;
}

.future-box { background: var(--dark2); border: 1px solid var(--dark3); padding: 1.3rem; }
.future-yr { font-size: 3.5rem; font-weight: 800; color: var(--dark4); line-height: 1; margin-bottom: 0.4rem; letter-spacing: -0.04em; }
.future-txt { font-size: 0.9rem; line-height: 1.95; color: var(--white-dim); white-space: pre-line; }

.divider { height: 1px; background: linear-gradient(90deg, var(--gold-border), transparent); margin: 1.8rem 0; }

.acts { display: flex; gap: 8px; margin-top: 2rem; flex-wrap: wrap; }
.btn-g { flex:1; min-width:110px; padding:12px 16px; background:var(--gold); color:var(--black); border:none; font-family:var(--sans); font-size:0.85rem; font-weight:700; cursor:pointer; letter-spacing:0.04em; transition:background 0.12s; }
.btn-g:hover { background:var(--gold-light); }
.btn-o { flex:1; min-width:110px; padding:12px 16px; background:transparent; color:var(--gold); border:1px solid var(--gold-border); font-family:var(--sans); font-size:0.85rem; font-weight:600; cursor:pointer; letter-spacing:0.04em; transition:background 0.12s, border-color 0.12s; }
.btn-o:hover { background:var(--gold-dim); border-color:var(--gold); }

/* loading */
.loading { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem; padding:4rem 2rem; min-height:50vh; }
.dots { display:flex; gap:5px; }
.dot { width:5px; height:5px; border-radius:50%; background:var(--gold); animation:blink 1.2s infinite; }
.dot:nth-child(2){animation-delay:0.2s;} .dot:nth-child(3){animation-delay:0.4s;}
@keyframes blink { 0%,80%,100%{opacity:0.15;} 40%{opacity:1;} }
.loading-t { font-family:var(--mono); font-size:10px; color:var(--gray); letter-spacing:0.18em; text-transform:uppercase; }

/* fade */
@keyframes up { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
.fade { animation: up 0.3s ease forwards; }

/* bg symbols */
.bgsym { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
.sym { position:absolute; opacity:0.03; animation:floatUp linear infinite; font-size:1.1rem; }
@keyframes floatUp { 0%{transform:translateY(110vh);opacity:0;} 8%{opacity:0.03;} 92%{opacity:0.03;} 100%{transform:translateY(-10vh);opacity:0;} }
</style>
</head>

<!-- INTRO -->
<div id="intro" class="screen active">
  <div class="intro-wrap">
    <div class="chip">MONEY SIMULATION</div>
    <h1 class="intro-h">백만장자<br><em>하루</em><br>체험기</h1>

    <div class="amount">₩ 100,000,000,000</div>
    <button class="btn" onclick="goName()">체험 시작하기 →</button>
    <div class="meta-row">
      <div class="meta-item"><div class="meta-n">30</div><div class="meta-l">Questions</div></div>
      <div class="meta-item"><div class="meta-n">8</div><div class="meta-l">Types</div></div>
      <div class="meta-item"><div class="meta-n">~10분</div><div class="meta-l">Duration</div></div>
    </div>
  </div>
</div>

<!-- NAME -->
<div id="name-input" class="screen">
  <div style="margin:auto;text-align:center;padding:2rem;">
    <div class="name-lbl">시작 전에</div>
    <h2 class="name-h">당신의 이름은?</h2>
    <input class="name-inp" id="uname" type="text" placeholder="이름 입력" maxlength="10"
      onkeydown="if(event.key==='Enter')startGame()">
    <br>
    <button class="btn btn-anim-none" onclick="startGame()">1,000억 받으러 가기 →</button>
  </div>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="hud">
    <div class="hud-c"><div class="hud-k">잔액</div><div class="hud-v" id="h-money">₩ 1,000억</div></div>
    <div class="hud-c"><div class="hud-k">진행</div><div class="hud-v" id="h-prog">1 / 30</div></div>
    <div class="hud-c"><div class="hud-k">시간대</div><div class="hud-v" id="h-part">🌅 아침</div></div>
  </div>
  <div class="prog-track"><div class="prog-fill" id="prog" style="width:3%"></div></div>
  <div class="part-bar">
    <div class="part-dot"></div>
    <div class="part-lbl" id="p-lbl">아침</div>
    <div class="part-time" id="p-time">오전 6시 ~ 9시</div>
  </div>
  <div class="game-body">
    <div class="q-scroll" id="qscroll">
      <div class="q-no" id="qno"></div>
      <div class="q-txt" id="qtxt"></div>
      <div class="choices" id="choices"></div>
    </div>
    <div class="tl-strip" id="tl-strip" style="display:none;">
      <div class="tl-label">LOG</div>
      <div class="tl-chips" id="tl-chips"></div>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <div class="r-inner" id="r-inner">
    <div class="loading">
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="loading-t">AI 분석 중...</div>
    </div>
  </div>
</div>

let G={qi:0,sc:{flex:0,rational:0,selfless:0},money:1000,tl:[],name:''};
let lastPart=-1;

// ─── SCREENS ───
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goName(){show('name-input');}
function startGame(){
  G.name=(document.getElementById('uname').value||'').trim()||'익명의 백만장자';
  show('game'); renderQ();
}

// ─── RENDER Q ───
function renderQ(){
  const q=Q[G.qi], pi=q.p, p=PARTS[pi];
  if(pi!==lastPart){
    document.getElementById('p-lbl').textContent=p.e+'  '+p.n;
    document.getElementById('p-time').textContent=p.t;
    lastPart=pi;
  }
  document.getElementById('h-money').textContent='₩ '+G.money.toLocaleString()+'억';
  document.getElementById('h-prog').textContent=(G.qi+1)+' / 30';
  document.getElementById('h-part').textContent=p.e+' '+p.n;
  document.getElementById('prog').style.width=((G.qi+1)/30*100)+'%';

  const ps=Q.findIndex(x=>x.p===pi);
  document.getElementById('qno').textContent='Q'+(G.qi+1)+'  ·  '+p.n+' '+(G.qi-ps+1)+'번째';
  document.getElementById('qtxt').innerHTML=q.txt.replace(/\n/g,'<br>');

  document.getElementById('choices').innerHTML=q.c.map((c,i)=>
    `<button class="choice" onclick="pick(${i})"><span class="c-e">${c.e}</span><span>${c.t}</span></button>`
  ).join('');

  const s=document.getElementById('qscroll');
  s.scrollTop=0;
  s.classList.remove('fade'); void s.offsetWidth; s.classList.add('fade');
}

// ─── PICK ───
function pick(idx){
  const q=Q[G.qi], c=q.c[idx];
  document.querySelectorAll('.choice').forEach((b,i)=>{b.classList.add('done');if(i===idx)b.classList.add('sel');});
  G.sc.flex+=c.s[0]; G.sc.rational+=c.s[1]; G.sc.selfless+=c.s[2];

  const cost=(COSTS[G.qi]||[])[idx]||0;
  if(cost>0) G.money=Math.max(0,G.money-cost);

  G.tl.push(c.e+' '+c.t);
  const chips=document.getElementById('tl-chips');
  const strip=document.getElementById('tl-strip');
  strip.style.display='flex';
  const ch=document.createElement('div'); ch.className='tl-chip';
  ch.textContent=c.e+' '+(c.t.length>15?c.t.slice(0,15)+'…':c.t);
  chips.appendChild(ch); chips.scrollLeft=chips.scrollWidth;
  setTimeout(()=>{G.qi++;if(G.qi>=Q.length)showResult();else renderQ();},380);
}

// ─── RESULT ───
function showResult(){show('result');setTimeout(renderResult,1600);}

function renderResult(){
  const s=G.sc, type=TYPES.find(t=>t.m(s));
  const spent=Math.min(1000,Math.max(0,1000-G.money));
  const remain=1000-spent;
  const spentPct=Math.round(spent/10);
  const remainPct=100-spentPct;

  document.getElementById('r-inner').innerHTML=`
    <div class="r-tag">— ${G.name}님의 유형 결과 —</div>
    <span class="r-emoji">${type.e}</span>
    <div class="r-name">${type.n}</div>
    <div class="r-desc">${type.d}</div>
    <div class="r-sec">
      <div class="r-sec-lbl">소비 리포트</div>
      <div class="spend-box">
        <div class="spend-big">${spent.toLocaleString()}억원</div>
        <div class="spend-sub">TODAY'S SPENDING / 1,000억 중</div>
        <div class="bar-row"><div class="bar-meta"><span>소비</span><span>${spentPct}%</span></div><div class="bar-track"><div class="bar-fill" id="bf1" style="width:0%"></div></div></div>
        <div class="bar-row"><div class="bar-meta"><span>잔액 ${remain.toLocaleString()}억</span><span>${remainPct}%</span></div><div class="bar-track"><div class="bar-fill b" id="bf2" style="width:0%"></div></div></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="r-sec">
      <div class="r-sec-lbl">AI 분석</div>
      <div class="comment-box" id="rcom">분석 중...</div>
    </div>
    <div class="divider"></div>
    <div class="r-sec">
      <div class="r-sec-lbl">10년 후 미래 예측</div>
      <div class="future-box"><div class="future-yr">2035</div><div class="future-txt" id="rfut">예측 중...</div></div>
    </div>
    <div class="acts">
      <button class="btn-g" onclick="doShare('${type.n}','${type.e}',${spent})">결과 이메일로 공유하기</button>
      <button class="btn-o" onclick="retry()">다시 하기</button>
    </div>`;
  setTimeout(()=>{document.getElementById('bf1').style.width=spentPct+'%';document.getElementById('bf2').style.width=remainPct+'%';},150);
  setTimeout(()=>tw('rcom',type.c,16),350);
  setTimeout(()=>tw('rfut',type.f,20),2000);
  callAPI(type);
}

function tw(id,txt,ms){
  const el=document.getElementById(id); if(!el)return; el.textContent=''; let i=0;
  const t=setInterval(()=>{el.textContent+=txt[i++];if(i>=txt.length)clearInterval(t);},ms);
}

async function callAPI(type){
  try{
    const sum=G.tl.slice(0,8).join(' / ');
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:100,
        messages:[{role:'user',content:`독설가 심리 분석가로서, 이 사람 선택들을 보고 "${type.n}" 유형에 맞게 날카롭고 재밌게 한 문장으로 디스해주세요. 35자 이내, 한국어만, 문장만 출력.\n선택들: ${sum}`}]})});
    if(!r.ok)return;
    const d=await r.json(), q=d.content?.[0]?.text?.trim();
    if(!q)return;
    const el=document.getElementById('rcom');
    if(el)setTimeout(()=>{el.textContent+='\n\n💬 '+q;},3000);
  }catch{}
}

function doShare(typeName, typeEmoji, spent){
  const rcom=document.getElementById('rcom');
  const rfut=document.getElementById('rfut');
  const comment=rcom?rcom.textContent:'';
  const future=rfut?rfut.textContent:'';
  const remain=1000-spent;

  const subject=encodeURIComponent(`[백만장자 하루 체험기] ${G.name}님의 결과 — ${typeEmoji} ${typeName}`);
  const body=encodeURIComponent(
`안녕하세요!

백만장자 하루 체험기 결과를 공유합니다 💸

━━━━━━━━━━━━━━━━━━━━
👤 이름: ${G.name}
${typeEmoji} 유형: ${typeName}
💰 오늘 소비: ${spent.toLocaleString()}억원
💵 잔액: ${remain.toLocaleString()}억원 / 1,000억원
━━━━━━━━━━━━━━━━━━━━

📋 AI 분석
${comment}

━━━━━━━━━━━━━━━━━━━━

🔮 10년 후 미래 예측
${future}

━━━━━━━━━━━━━━━━━━━━

당신은 어떤 유형인가요? 직접 테스트해보세요!
`);
  window.location.href=`mailto:?subject=${subject}&body=${body}`;
}

function retry(){
  G={qi:0,sc:{flex:0,rational:0,selfless:0},money:1000,tl:[],name:G.name};
  lastPart=-1;
  document.getElementById('tl-chips').innerHTML='';
  document.getElementById('tl-strip').style.display='none';
  show('game'); renderQ();
}
</script>
</body>
</html>
