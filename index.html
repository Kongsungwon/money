<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>백만장자 하루 체험기</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  
  --gold:#C8A84B; --gold-light:#E2C97E; --gold-dim:rgba(200,168,75,0.12);
  --gold-border:rgba(200,168,75,0.28); --gold-glow:rgba(200,168,75,0.18);

  
  --black:#050F08; --dark:#081508; --dark2:#0D1F0F;
  --dark3:#162A18; --dark4:#1E3820;

  
  --white:#EEF0E6; --white-dim:rgba(238,240,230,0.58);

  
  --gray:#4A7A58; --gray2:#7BAF88;

  
  --red:#E05C5C;

  --sans:'Pretendard',-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --mono:'IBM Plex Mono','Courier New',monospace;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:var(--black);color:var(--white);font-family:var(--sans);-webkit-font-smoothing:antialiased;}

.screen{position:fixed;inset:0;display:none;}
.screen.active{display:flex;flex-direction:column;}

#intro{
  align-items:center;justify-content:center;text-align:center;
  padding:2rem;overflow-y:auto;background:var(--black);
}

#intro::before{
  content:'';position:fixed;top:40%;left:50%;
  transform:translate(-50%,-50%);
  width:700px;height:700px;
  background:radial-gradient(circle,rgba(200,168,75,0.10) 0%,rgba(29,120,80,0.08) 40%,transparent 70%);
  pointer-events:none;z-index:0;
}
#intro::after{
  content:'';position:fixed;bottom:-80px;right:-80px;
  width:350px;height:350px;
  background:radial-gradient(circle,rgba(29,120,80,0.10) 0%,transparent 65%);
  pointer-events:none;z-index:0;
}

.intro-inner{position:relative;z-index:1;max-width:480px;margin:auto;display:flex;flex-direction:column;align-items:center;}

.chip{
  display:inline-block;font-family:var(--mono);font-size:10px;
  letter-spacing:0.22em;color:var(--gold);
  border:1px solid var(--gold-border);padding:5px 14px;margin-bottom:2rem;
  opacity:0;animation:up 0.6s 0.1s forwards;
}

.intro-h{
  font-size:clamp(3rem,10vw,5.5rem);font-weight:800;
  line-height:0.95;letter-spacing:-0.04em;margin-bottom:1.8rem;
  font-family:var(--sans);
  opacity:0;animation:up 0.6s 0.3s forwards;
}
.intro-h em{font-style:normal;color:var(--gold);}

.intro-p{
  font-size:0.9rem;color:var(--white-dim);line-height:1.85;
  font-weight:400;margin-bottom:2rem;font-family:var(--sans);
  opacity:0;animation:up 0.6s 0.5s forwards;
}

.amount{
  font-family:var(--mono);font-size:clamp(0.85rem,2.5vw,1.1rem);
  color:var(--gold);background:var(--gold-dim);
  border:1px solid var(--gold-border);padding:10px 20px;
  margin-bottom:2.5rem;letter-spacing:0.06em;
  opacity:0;animation:up 0.6s 0.7s forwards;
}

.btn{
  background:var(--gold);color:var(--black);border:none;
  padding:13px 32px;font-family:var(--sans);font-size:0.9rem;
  font-weight:700;letter-spacing:0.05em;cursor:pointer;
  transition:background 0.12s,transform 0.12s;
  opacity:0;animation:up 0.6s 0.9s forwards;
}
.btn:hover{background:var(--gold-light);transform:translateY(-1px);}
.btn-plain{animation:none;opacity:1;}

.meta-row{display:flex;gap:2.5rem;margin-top:3rem;opacity:0;animation:up 0.6s 1.1s forwards;}
.meta-item{text-align:center;}
.meta-n{font-size:1.5rem;font-weight:800;color:var(--gold);letter-spacing:-0.03em;font-family:var(--sans);}
.meta-l{font-family:var(--mono);font-size:9px;color:var(--gray);letter-spacing:0.18em;text-transform:uppercase;margin-top:2px;}

.coins-wrap{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.coin-float{position:absolute;animation:coinRise linear infinite;opacity:0;}
@keyframes coinRise{
  0%{transform:translateY(110vh) rotate(0deg);opacity:0;}
  5%{opacity:0.22;}90%{opacity:0.14;}
  100%{transform:translateY(-10vh) rotate(45deg);opacity:0;}
}

#name-input{align-items:center;justify-content:center;padding:2rem;text-align:center;}
.name-lbl{font-family:var(--mono);font-size:10px;letter-spacing:0.2em;color:var(--gold);text-transform:uppercase;margin-bottom:1.2rem;}
.name-h{font-size:1.7rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:2.2rem;font-family:var(--sans);}
.name-inp{
  background:transparent;border:none;border-bottom:2px solid var(--gold);
  color:var(--white);font-family:var(--sans);font-size:1.8rem;font-weight:700;
  text-align:center;width:300px;max-width:88vw;padding:6px 4px;outline:none;
  margin-bottom:2.5rem;letter-spacing:-0.02em;
}
.name-inp::placeholder{color:var(--dark4);}

#game{height:100dvh;overflow:hidden;background:var(--black);}

.hud{
  flex-shrink:0;display:grid;grid-template-columns:1fr 1fr 1fr;
  border-bottom:1px solid var(--dark3);
  background:rgba(8,8,8,0.98);
  box-shadow:0 0 24px rgba(200,168,75,0.07);
}
.hud-c{padding:9px 14px;border-right:1px solid var(--dark3);position:relative;}
.hud-c:last-child{border-right:none;}
.hud-c:first-child::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 100%,rgba(200,168,75,0.08) 0%,transparent 70%);
  pointer-events:none;
}
.hud-k{font-family:var(--mono);font-size:9px;letter-spacing:0.2em;color:var(--gray);text-transform:uppercase;margin-bottom:2px;}
.hud-v{font-size:0.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color 0.3s,transform 0.2s;font-family:var(--sans);}

.hud-v.flash{animation:moneyFlash 0.5s ease;}
@keyframes moneyFlash{
  0%{color:var(--white);transform:scale(1);}
  30%{color:var(--red);transform:scale(1.08);}
  100%{color:var(--white);transform:scale(1);}
}
.money-delta{
  font-family:var(--mono);font-size:9px;color:var(--red);
  letter-spacing:0.05em;position:absolute;bottom:-16px;left:14px;
  animation:deltaFade 1.8s ease forwards;white-space:nowrap;
}
@keyframes deltaFade{
  0%{opacity:1;transform:translateY(0);}
  60%{opacity:1;transform:translateY(-4px);}
  100%{opacity:0;transform:translateY(-8px);}
}

.prog-track{height:2px;background:var(--dark3);flex-shrink:0;}
.prog-fill{height:100%;background:var(--gold);transition:width 0.4s ease;box-shadow:0 0 6px rgba(200,168,75,0.45);}

.part-bar{
  flex-shrink:0;display:flex;flex-direction:column;gap:6px;
  padding:8px 16px 10px;border-bottom:1px solid var(--dark3);
  background:var(--dark2);position:relative;overflow:hidden;
}
.part-bar::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(200,168,75,0.05) 0%,transparent 50%);
  pointer-events:none;
}
.part-bar-top{display:flex;align-items:center;gap:8px;}
.part-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0;box-shadow:0 0 6px rgba(200,168,75,0.7);}
.part-lbl{font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:0.12em;}
.part-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(200,168,75,0.4),transparent);}
.part-time-lbl{font-family:var(--mono);font-size:9px;color:var(--gray);}
.part-steps{display:flex;gap:4px;padding-left:13px;}
.pstep{width:18px;height:2px;background:rgba(200,168,75,0.12);transition:background 0.3s,box-shadow 0.3s;}
.pstep.done{background:var(--gold);box-shadow:0 0 5px rgba(200,168,75,0.5);}
.pstep.cur{background:var(--gold-light);animation:stepPulse 1.4s ease-in-out infinite;}
@keyframes stepPulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

.game-body{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}

.q-scroll{
  flex:1;overflow-y:auto;padding:18px 16px 12px;
  display:flex;flex-direction:column;gap:14px;min-height:0;
}
.q-scroll::-webkit-scrollbar{width:2px;}
.q-scroll::-webkit-scrollbar-thumb{background:var(--dark4);}

.q-no{font-family:var(--mono);font-size:9px;color:var(--gray);letter-spacing:0.18em;}
.q-txt{font-size:clamp(0.95rem,2.2vw,1.15rem);font-weight:600;line-height:1.65;letter-spacing:-0.02em;font-family:var(--sans);}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
@media(max-width:460px){}

.choice{
  background:var(--dark2);border:1px solid var(--dark3);
  color:var(--white-dim);padding:11px 13px;text-align:left;cursor:pointer;
  font-family:var(--sans);display:flex;align-items:flex-start;gap:9px;
  font-size:0.85rem;line-height:1.55;font-weight:400;letter-spacing:-0.01em;
  position:relative;overflow:hidden;
  transition:border-color 0.13s,background 0.13s,color 0.13s,transform 0.13s,box-shadow 0.13s;
}
.choice::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--gold);transform:scaleY(0);
  transition:transform 0.13s ease;transform-origin:bottom;
}
.choice:hover{border-color:var(--gold-border);background:var(--gold-dim);color:var(--white);transform:translateX(4px);box-shadow:-4px 0 12px rgba(200,168,75,0.1);}
.choice:hover::before{transform:scaleY(1);}
.choice.sel{border-color:var(--gold);background:rgba(200,168,75,0.15);color:var(--white);transform:translateX(4px);}
.choice.sel::before{transform:scaleY(1);}
.choice
.choice.done
.c-e{font-size:1.05rem;flex-shrink:0;margin-top:1px;}

.choice-enter{animation:choiceIn 0.28s ease forwards;opacity:0;}
@keyframes choiceIn{from{opacity:0;transform:translateY(8px) translateX(-4px);}to{opacity:1;transform:translateY(0) translateX(0);}}

.tl-strip{flex-shrink:0;border-top:1px solid var(--dark3);background:var(--dark);padding:7px 16px;display:flex;align-items:center;gap:7px;overflow:hidden;}
.tl-label{font-family:var(--mono);font-size:9px;color:var(--gray);letter-spacing:0.12em;flex-shrink:0;}
.tl-chips{display:flex;gap:5px;overflow-x:auto;flex:1;}
.tl-chips::-webkit-scrollbar{display:none;}
.tl-chip{flex-shrink:0;font-family:var(--mono);font-size:9px;color:var(--gray2);background:var(--dark3);padding:3px 7px;white-space:nowrap;animation:chipIn 0.22s ease forwards;}
@keyframes chipIn{from{opacity:0;transform:scale(0.88);}to{opacity:1;transform:scale(1);}}

#result{overflow-y:auto;background:var(--black);}
#result::-webkit-scrollbar{width:2px;}
#result::-webkit-scrollbar-thumb{background:var(--dark4);}

.r-inner{max-width:660px;margin:0 auto;padding:3rem 1.5rem 4rem;width:100%;}

.r-tag{font-family:var(--mono);font-size:9px;letter-spacing:0.22em;color:var(--gold);text-transform:uppercase;margin-bottom:1rem;opacity:0;animation:up 0.5s 0.1s forwards;}

  65%{transform:scale(1.22) rotate(4deg);opacity:1;}
  100%{transform:scale(1) rotate(0deg);opacity:1;}
}
  to{opacity:1;transform:translateY(0);filter:blur(0);}
}

.r-sec{margin-bottom:2rem;opacity:0;animation:up 0.5s forwards;}
.r-sec-lbl{font-family:var(--mono);font-size:9px;letter-spacing:0.22em;color:var(--gold);text-transform:uppercase;margin-bottom:0.9rem;padding-bottom:6px;border-bottom:1px solid var(--dark3);}

.spend-box{background:var(--dark2);border:1px solid var(--dark3);padding:1.3rem;}
.spend-big{font-size:2.2rem;font-weight:800;color:var(--gold);letter-spacing:-0.03em;font-family:var(--sans);}
.spend-sub{font-family:var(--mono);font-size:9px;color:var(--gray);letter-spacing:0.12em;margin-bottom:1.2rem;margin-top:2px;}
.bar-row{margin-bottom:8px;}
.bar-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--gray2);margin-bottom:4px;}
.bar-track{height:2px;background:var(--dark4);}
.bar-fill{height:100%;background:var(--gold);transition:width 1.2s cubic-bezier(0.16,1,0.3,1);}
.bar-fill.b{background:#4A90D9;}

.comment-box{border-left:2px solid var(--gold);padding:1.1rem 1.3rem;font-size:0.92rem;line-height:2.0;color:var(--white-dim);background:var(--dark2);white-space:pre-line;font-weight:400;letter-spacing:-0.01em;font-family:var(--sans);}

.future-box{background:var(--dark2);border:1px solid var(--dark3);padding:1.3rem;}
.future-yr{font-size:3.5rem;font-weight:800;color:var(--dark4);line-height:1;margin-bottom:0.4rem;letter-spacing:-0.04em;font-family:var(--sans);opacity:0.6;}
.future-txt{font-size:0.92rem;line-height:2.0;color:var(--white-dim);white-space:pre-line;font-weight:400;letter-spacing:-0.01em;font-family:var(--sans);}

.divider{height:1px;background:linear-gradient(90deg,var(--gold-border),transparent);margin:1.8rem 0;}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:4rem 2rem;min-height:50vh;}
.dots{display:flex;gap:5px;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:blink 1.2s infinite;box-shadow:0 0 6px rgba(200,168,75,0.5);}
.dot:nth-child(2){animation-delay:0.2s;}.dot:nth-child(3){animation-delay:0.4s;}
@keyframes blink{0%,80%,100%{opacity:0.15;}40%{opacity:1;}}
.loading-t{font-family:var(--mono);font-size:10px;color:var(--gray);letter-spacing:0.18em;text-transform:uppercase;}

.share-card {
  width: 360px;
  background: #0D1F0F;
  border: 1px solid rgba(200,168,75,0.3);
  padding: 32px 28px 28px;
  position: relative;
  overflow: hidden;
  margin: 0 auto 1.5rem;
  flex-shrink: 0;
}
.share-card::before {
  content:'';position:absolute;top:-80px;left:50%;
  transform:translateX(-50%);width:320px;height:320px;
  background:radial-gradient(circle,rgba(200,168,75,0.18) 0%,transparent 65%);
  pointer-events:none;
}
.share-card::after {
  content:'';position:absolute;
  top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.sc-header {
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;
}
.sc-site {
  font-family:var(--mono);font-size:9px;color:rgba(200,168,75,0.5);
  letter-spacing:0.2em;text-transform:uppercase;
}
.sc-date {
  font-family:var(--mono);font-size:9px;color:var(--gray);
  letter-spacing:0.1em;
}
.sc-emoji { font-size:3.5rem;display:block;text-align:center;margin-bottom:10px; }
.sc-type {
  font-size:1.9rem;font-weight:800;color:var(--gold);
  letter-spacing:-0.03em;text-align:center;margin-bottom:4px;
  text-shadow:0 0 24px rgba(200,168,75,0.35);
  font-family:var(--sans);
}
.sc-desc {
  font-size:0.82rem;color:var(--gray2);text-align:center;
  margin-bottom:20px;font-weight:400;
  font-family:var(--sans);letter-spacing:-0.01em;
}
.sc-divider {
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,168,75,0.25),transparent);
  margin-bottom:16px;
}
.sc-stats {
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px;
}
.sc-stat {
  background:rgba(200,168,75,0.06);border:1px solid rgba(200,168,75,0.12);
  padding:8px 6px;text-align:center;
}
.sc-stat-n {
  font-size:1.1rem;font-weight:800;color:var(--gold);
  letter-spacing:-0.02em;display:block;font-family:var(--sans);
}
.sc-stat-l {
  font-family:var(--mono);font-size:8px;color:var(--gray);
  letter-spacing:0.1em;text-transform:uppercase;margin-top:2px;
}
.sc-comment {
  font-size:0.82rem;color:var(--white-dim);line-height:1.7;
  border-left:2px solid var(--gold);padding-left:10px;
  margin-bottom:16px;
  font-family:var(--sans);font-weight:400;letter-spacing:-0.01em;
}
.sc-footer {
  display:flex;justify-content:space-between;align-items:center;
}
.sc-tag {
  font-family:var(--mono);font-size:8px;color:rgba(200,168,75,0.4);
  letter-spacing:0.15em;
}
.sc-bar-wrap { margin-bottom:12px; }
.sc-bar-label {
  display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:8px;color:var(--gray2);margin-bottom:3px;
}
.sc-bar-track { height:2px;background:rgba(255,255,255,0.06); }
.sc-bar-fill { height:100%;background:var(--gold); }

.share-btns {
  display:flex;gap:8px;margin-top:0;flex-wrap:wrap;
}
.btn-share-img {
  flex:1;min-width:120px;padding:12px 16px;
  background:var(--gold);color:var(--black);border:none;
  font-family:var(--sans);font-size:0.85rem;font-weight:700;
  cursor:pointer;letter-spacing:0.04em;transition:background 0.12s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-share-img:hover{background:var(--gold-light);}
.btn-share-img:disabled{opacity:0.5;cursor:not-allowed;}
.btn-share-copy {
  flex:1;min-width:120px;padding:12px 16px;
  background:transparent;color:var(--gold);
  border:1px solid var(--gold-border);
  font-family:var(--sans);font-size:0.85rem;font-weight:600;
  cursor:pointer;letter-spacing:0.04em;
  transition:background 0.12s,border-color 0.12s;
}
.btn-share-copy:hover{background:var(--gold-dim);border-color:var(--gold);}

.share-hint {
  font-family:var(--mono);font-size:9px;color:var(--gray);
  text-align:center;margin-top:8px;letter-spacing:0.08em;
}

.btn-retry-bottom {
  width:100%;padding:12px;background:transparent;
  color:var(--gray2);border:1px solid var(--dark3);
  font-family:var(--sans);font-size:0.85rem;cursor:pointer;
  margin-top:8px;transition:color 0.12s,border-color 0.12s;
  letter-spacing:0.04em;
}
.btn-retry-bottom:hover{color:var(--white);border-color:var(--gray2);}

.grade-box{display:flex;align-items:center;gap:16px;background:var(--dark2);border:1px solid var(--dark3);padding:1.2rem;}
.grade-emoji{font-size:2.5rem;flex-shrink:0;}
.grade-name{font-size:1.3rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px;font-family:var(--sans);}
.grade-sub{font-family:var(--mono);font-size:9px;color:var(--gray2);letter-spacing:0.06em;line-height:1.8;}

.badges-wrap{display:flex;flex-wrap:wrap;gap:8px;}
.badge-item{display:flex;flex-direction:column;align-items:center;gap:4px;
  background:var(--dark2);border:1px solid var(--dark3);
  padding:10px 14px;min-width:80px;transition:border-color 0.15s;}
.badge-item:hover{border-color:var(--gold-border);}
.badge-emoji{font-size:1.6rem;}
.badge-label{font-size:0.72rem;color:var(--gray2);font-family:var(--sans);
  font-weight:500;text-align:center;line-height:1.4;letter-spacing:-0.01em;}

.combo-box{background:var(--dark2);border:1px solid var(--dark3);padding:1.2rem;}
.combo-main{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.combo-second{margin-top:10px;}
.combo-pct{font-size:1.3rem;font-weight:800;letter-spacing:-0.02em;flex-shrink:0;width:52px;font-family:var(--sans);}
.combo-name{font-size:0.9rem;font-weight:600;color:var(--white);font-family:var(--sans);letter-spacing:-0.01em;}
.combo-name--second{color:var(--gray2);}
.combo-bar{height:3px;background:rgba(200,168,75,0.1);margin-bottom:4px;}
.combo-bar-fill{height:100%;background:var(--gold);}
.combo-desc{font-size:0.88rem;color:var(--white-dim);margin-top:12px;
  padding-top:12px;border-top:1px solid var(--dark3);line-height:1.75;
  font-family:var(--sans);font-weight:400;letter-spacing:-0.01em;}

.cat-box{background:var(--dark2);border:1px solid var(--dark3);padding:1.2rem;}
.cat-top{font-size:0.88rem;color:var(--white-dim);margin-bottom:14px;font-family:var(--sans);font-weight:400;letter-spacing:-0.01em;}
.cat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.cat-label{font-size:0.78rem;color:var(--gray2);font-family:var(--sans);
  font-weight:500;width:74px;flex-shrink:0;letter-spacing:-0.01em;}
.cat-bar-wrap{flex:1;display:flex;align-items:center;gap:8px;}
.cat-bar-track{flex:1;height:3px;background:rgba(255,255,255,0.05);}

let G={qi:0,sc:{flex:0,rational:0,selfless:0},money:1000,tl:[],name:'',

let lastPart=-1;

// ═══════════════════════════════
//  SCREENS
// ═══════════════════════════════
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  // 동전은 인트로에서만
  const cw=document.getElementById('coins-wrap');
  if(cw) cw.style.display=(id==='intro')?'block':'none';
}
function goName(){show('name-input');}
function startGame(){
  G.name=(document.getElementById('uname').value||'').trim()||'익명의 백만장자';
  show('game'); renderQ();
}

// ═══════════════════════════════
//  RENDER Q
// ═══════════════════════════════
function renderQ(){
  const q=Q[G.qi], pi=q.p, p=PARTS[pi];

  // 파트 바
  if(pi!==lastPart){
    document.getElementById('p-lbl').textContent=p.e+'  '+p.n;
    document.getElementById('p-time').textContent=p.t;
    lastPart=pi;
  }

  // ⑥ 파트 스텝
  const partStart=Q.findIndex(x=>x.p===pi);
  const partEnd=Q.map(x=>x.p).lastIndexOf(pi);
  const partLen=partEnd-partStart+1;
  const qInPart=G.qi-partStart;
  const stepsEl=document.getElementById('part-steps');
  if(stepsEl){
    stepsEl.innerHTML=Array.from({length:partLen},(_,i)=>{
      let cls='pstep';
      if(i<qInPart) cls+=' done';
      else if(i===qInPart) cls+=' cur';
      return `<div class="${cls}"></div>`;
    }).join('');
  }

  // HUD
  document.getElementById('h-money').textContent='₩ '+G.money.toLocaleString()+'억';
  document.getElementById('h-prog').textContent=(G.qi+1)+' / 30';
  document.getElementById('h-part').textContent=p.e+' '+p.n;
  document.getElementById('prog').style.width=((G.qi+1)/30*100)+'%';

  // 질문
  document.getElementById('qno').textContent='Q'+(G.qi+1)+'  ·  '+p.n+' '+(qInPart+1)+'번째';
  document.getElementById('qtxt').innerHTML=q.txt.replace(/\n/g,'<br>');

  // ④ 선택지 순차 등장
  document.getElementById('choices').innerHTML=q.c.map((c,i)=>
    `<button class="choice choice-enter" style="animation-delay:${i*0.05}s" onclick="pick(${i})">
      <span class="c-e">${c.e}</span><span>${c.t}</span>
    </button>`
  ).join('');

  const s=document.getElementById('qscroll');
  s.scrollTop=0;
  s.classList.remove('fade'); void s.offsetWidth; s.classList.add('fade');
}

// ═══════════════════════════════
//  PICK
// ═══════════════════════════════
function pick(idx){
  const q=Q[G.qi], c=q.c[idx];
  document.querySelectorAll('.choice').forEach((b,i)=>{
    b.classList.add('done');
    if(i===idx) b.classList.add('sel');
  });

  G.sc.flex+=c.s[0]; G.sc.rational+=c.s[1]; G.sc.selfless+=c.s[2];

  // 카테고리 추적
  const cat=(CATS[G.qi]||[])[idx]||'n';
  if(cat!=='n') G.cats[cat]=(G.cats[cat]||0)+1;

  // ③ 잔액 차감 + 애니메이션
  const cost=(COSTS[G.qi]||[])[idx]||0;
  if(cost>0){
    const prev=G.money;
    G.money=Math.max(0,G.money-cost);
    const moneyEl=document.getElementById('h-money');
    if(moneyEl){
      moneyEl.classList.remove('flash');
      void moneyEl.offsetWidth;
      moneyEl.classList.add('flash');
      // 카운트다운
      const start=prev,end=G.money,dur=480;
      const t0=performance.now();
      function tick(now){
        const p=Math.min((now-t0)/dur,1);
        moneyEl.textContent='₩ '+Math.round(start+(end-start)*p).toLocaleString()+'억';
        if(p<1) requestAnimationFrame(tick);
        else moneyEl.textContent='₩ '+end.toLocaleString()+'억';
      }
      requestAnimationFrame(tick);
      // 차감 표시
      const d=document.createElement('div');
      d.className='money-delta';
      d.textContent='▼ −'+cost.toLocaleString()+'억';
      moneyEl.parentNode.style.position='relative';
      moneyEl.parentNode.appendChild(d);
      setTimeout(()=>d.remove(),1900);
    }
  }

  // 타임라인
  G.tl.push(c.e+' '+c.t);
  const chips=document.getElementById('tl-chips');
  document.getElementById('tl-strip').style.display='flex';
  const ch=document.createElement('div');
  ch.className='tl-chip';
  ch.textContent=c.e+' '+(c.t.length>15?c.t.slice(0,15)+'…':c.t);
  chips.appendChild(ch);
  chips.scrollLeft=chips.scrollWidth;

  setTimeout(()=>{
    G.qi++;
    if(G.qi>=Q.length) showResult();
    else renderQ();
  },420);
}

        <div class="sc-stat">

          <span class="sc-stat-l">소비</span>
        </div>
        <div class="sc-stat">
          <span class="sc-stat-n">${grade.emoji} ${spentPct}%</span>
          <span class="sc-stat-l">탕진율</span>
        </div>
        <div class="sc-stat">
          <span class="sc-stat-n">상위${percentile}%</span>
          <span class="sc-stat-l">탕진러</span>
        </div>
      </div>
      <div class="sc-bar-wrap">
        <div class="sc-bar-label"><span>소비 ${spent.toLocaleString()}억</span><span>잔액 ${remain.toLocaleString()}억</span></div>
        <div class="sc-bar-track"><div class="sc-bar-fill" style="width:${spentPct}%"></div></div>
      </div>
      <div class="sc-comment" id="sc-comment-text">${shortComment}</div>
      <div class="sc-footer">
        <span class="sc-tag">30개의 선택이 만든 결과</span>
        <span class="sc-tag">#백만장자체험기</span>
      </div>
    </div>

    <!-- 공유 버튼 -->
    <div class="share-btns">
      <button class="btn-share-img" id="btn-save" onclick="saveCard()">📥 카드 저장</button>
      <button class="btn-share-copy" onclick="copyResult('${type.n}','${type.e}',${spent},${percentile},this)">🔗 텍스트 복사</button>
    </div>
    <div class="share-hint">이미지를 저장해서 카카오톡·인스타에 공유해보세요!</div>

    <div class="divider"></div>

    <!-- 탕진 등급 -->
    <div class="r-sec" style="animation-delay:1.1s">
      <div class="r-sec-lbl">탕진 등급</div>
      <div class="grade-box">
        <div class="grade-emoji">${grade.emoji}</div>
        <div class="grade-info">
          <div class="grade-name" style="color:${grade.color}">${grade.grade}</div>
          <div class="grade-sub">탕진율 ${spentPct}% · 참가자 평균 대비 ${ratio}배 · 상위 ${percentile}%</div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 획득 뱃지 -->
    <div class="r-sec" style="animation-delay:1.2s">
      <div class="r-sec-lbl">획득 뱃지</div>
      <div class="badges-wrap">
        ${badges.map(b=>`
          <div class="badge-item">
            <div class="badge-emoji">${b.e}</div>
            <div class="badge-label">${b.l}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="divider"></div>

    <!-- 조합 유형 -->
    <div class="r-sec" style="animation-delay:1.3s">
      <div class="r-sec-lbl">유형 분석</div>
      <div class="combo-box">
        <div class="combo-main">
          <span class="combo-pct" style="color:var(--gold);font-family:var(--sans)">${combo70}%</span>
          <span class="combo-name">${type.e} ${type.n}</span>
        </div>
        <div class="combo-bar">
          <div class="combo-bar-fill" style="width:${combo70}%"></div>
        </div>
        ${secondType?`
        <div class="combo-main combo-second">
          <span class="combo-pct" class="combo-name combo-name--second">${combo30}%</span>
          <span class="combo-name" class="combo-name combo-name--second">${secondType.e} ${secondType.n}</span>
        </div>
        <div class="combo-bar" style="background:rgba(255,255,255,0.04)">
          <div class="combo-bar-fill" style="width:${combo30}%;background:var(--dark4)"></div>
        </div>`:''}
        <div class="combo-desc">${spendPattern}</div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 소비 카테고리 -->
    <div class="r-sec" style="animation-delay:1.4s">
      <div class="r-sec-lbl">소비 카테고리 분석</div>
      <div class="cat-box">
        <div class="cat-top">가장 많이 쓴 곳 <span style="color:var(--gold);font-weight:700;font-family:var(--sans);">${topCat}</span></div>
        ${['realestate','luxury','invest','donate','leisure'].map(k=>{
          const v=G.cats[k]||0;
          const maxV=Math.max(...Object.values(G.cats),1);
          const pct=Math.round(v/maxV*100);
          const color=k==='realestate'?'#E07B39':k==='luxury'?'var(--gold)':k==='invest'?'#4A90D9':k==='donate'?'#27AE60':'#9B59B6';
          return `<div class="cat-row">
            <div class="cat-label">${catLabels[k]}</div>
            <div class="cat-bar-wrap">
              <div class="cat-bar-track">
                <div class="cat-bar-fill" style="width:${pct}%;background:${color};"></div>
              </div>
              <span class="cat-count">${v}회</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="divider"></div>

    <!-- AI 분석 -->
    <div class="r-sec" style="animation-delay:1.5s">
      <div class="r-sec-lbl">AI 분석</div>
      <div class="comment-box" id="rcom">분석 중...</div>
    </div>

    <div class="divider"></div>

    <!-- 소비 리포트 -->
    <div class="r-sec" style="animation-delay:1.6s">
      <div class="r-sec-lbl">소비 리포트</div>
      <div class="spend-box">
        <div class="spend-big">${spent.toLocaleString()}억원</div>
        <div class="spend-sub">TODAY'S SPENDING / 1,000억 중</div>
        <div class="bar-row">
          <div class="bar-meta"><span>소비</span><span>${spentPct}%</span></div>
          <div class="bar-track"><div class="bar-fill" id="bf1" style="width:0%"></div></div>
        </div>
        <div class="bar-row">
          <div class="bar-meta"><span>잔액 ${remain.toLocaleString()}억</span><span>${remainPct}%</span></div>
          <div class="bar-track"><div class="bar-fill b" id="bf2" style="width:0%"></div></div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 미래 예측 -->
    <div class="r-sec" style="animation-delay:1.7s">
      <div class="r-sec-lbl">10년 후 미래 예측</div>
      <div class="future-box">
        <div class="future-yr">2035</div>
        <div class="future-txt" id="rfut">예측 중...</div>
      </div>
    </div>

    <button class="btn-retry-bottom" onclick="retry()">↺ 다시 하기</button>
  `;

  setTimeout(()=>{
    const b1=document.getElementById('bf1');
    const b2=document.getElementById('bf2');
    if(b1) b1.style.width=spentPct+'%';
    if(b2) b2.style.width=remainPct+'%';
  },1300);

  setTimeout(()=>tw('rcom',type.c,16),1500);
  setTimeout(()=>tw('rfut',type.f,20),3000);
  callAPI(type);
}

// ═══════════════════════════════
//  카드 저장
// ═══════════════════════════════
async function saveCard(){
  const btn=document.getElementById('btn-save');
  const card=document.getElementById('share-card');
  if(!btn||!card) return;

  btn.disabled=true;
  btn.textContent='⏳ 저장 중...';

  try{
    const canvas=await html2canvas(card,{
      backgroundColor:'#050F08',
      scale:2,
      useCORS:true,
      logging:false,
      width:360,
      windowWidth:360,
    });

    const link=document.createElement('a');
    link.download='백만장자_체험기_결과.png';
    link.href=canvas.toDataURL('image/png');
    link.click();

    btn.textContent='✅ 저장 완료!';
    setTimeout(()=>{btn.disabled=false;btn.textContent='📥 카드 저장';},2500);
  }catch(e){
    btn.textContent='❌ 저장 실패';
    btn.disabled=false;
    console.error(e);
  }
}

// ═══════════════════════════════
//  텍스트 복사
// ═══════════════════════════════
function copyResult(typeName, typeEmoji, spent, percentile, btnEl){
  const remain=1000-spent;
  const spentPct=Math.round(spent/10);
  const txt=
`💸 백만장자 하루 체험기 결과

${typeEmoji} ${typeName}
💰 소비: ${spent.toLocaleString()}억원 / 탕진율 ${spentPct}%
💵 잔액: ${remain.toLocaleString()}억원
📊 상위 ${percentile}% 탕진러

나는 어떤 백만장자 유형?
#백만장자체험기 #돈있으면나도이래`;

  if(navigator.clipboard){
    navigator.clipboard.writeText(txt).then(()=>{
      if(btnEl){
        const orig=btnEl.textContent;
        btnEl.textContent='✅ 복사됐습니다!';
        setTimeout(()=>{btnEl.textContent=orig;},2000);
      }
    });
  }
}

function tw(id,txt,ms){
  const el=document.getElementById(id);
  if(!el)return;
  el.textContent='';
  let i=0;
  const t=setInterval(()=>{
    el.textContent+=txt[i++];
    if(i>=txt.length) clearInterval(t);
  },ms);
}

async function callAPI(type){
  try{
    const sum=G.tl.slice(0,8).join(' / ');
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:100,
        messages:[{role:'user',content:`독설가 심리 분석가로서, 이 사람 선택들을 보고 "${type.n}" 유형에 맞게 날카롭고 재밌게 한 문장으로 디스해주세요. 35자 이내, 한국어만, 문장만 출력.\n선택들: ${sum}`}]
      })
    });
    if(!r.ok)return;
    const d=await r.json(), q=d.content?.[0]?.text?.trim();
    if(!q)return;
    // 본문 AI 분석에 추가
    const el=document.getElementById('rcom');
    if(el) setTimeout(()=>{el.textContent+='\n\n💬 '+q;},3500);
    // 카드 멘트도 업데이트
    const cardComment=document.getElementById('sc-comment-text');
    if(cardComment) setTimeout(()=>{cardComment.textContent=q;},3600);
  }catch{}
}

function retry(){
  G={qi:0,sc:{flex:0,rational:0,selfless:0},money:1000,tl:[],name:G.name,
    cats:{realestate:0,luxury:0,invest:0,donate:0,leisure:0}};
  lastPart=-1;
  document.getElementById('tl-chips').innerHTML='';
  document.getElementById('tl-strip').style.display='none';
  show('game');
  renderQ();
}
</script>
